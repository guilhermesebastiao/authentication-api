<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ative sua conta</title>
    <style>
        @media only screen and (max-width: 600px) {
            .email-shell { width: 100% !important; }
            .email-card { border-left: 0 !important; border-right: 0 !important; }
            .email-content { padding: 32px 24px !important; }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#fafafa; color:#171717; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fafafa;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" class="email-shell" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:560px;">
                <tr>
                    <td style="padding:0 0 20px 4px; font-size:18px; font-weight:700; letter-spacing:-0.3px; color:#171717;">
                        Authentication API
                    </td>
                </tr>
                <tr>
                    <td class="email-card" style="background-color:#ffffff; border:1px solid #e5e5e5; border-radius:8px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td class="email-content" style="padding:40px;">
                                    <p style="margin:0 0 8px; color:#737373; font-size:14px;">Olá, <span th:text="${email}" style="color:#171717;">seu e-mail</span>.</p>
                                    <h1 style="margin:0 0 12px; color:#171717; font-size:24px; line-height:32px; letter-spacing:-0.5px;">Ative sua conta</h1>
                                    <p style="margin:0 0 28px; color:#737373; font-size:15px; line-height:24px;">Use o código abaixo para confirmar seu endereço de email e ativar sua conta.</p>
                                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                        <tr>
                                            <td align="center" style="padding:20px; background-color:#fafafa; border:1px solid #e5e5e5; border-radius:6px;">
                                                <span th:text="${otp}" style="color:#171717; font-size:30px; line-height:36px; font-weight:700; letter-spacing:8px;">000000</span>
                                            </td>
                                        </tr>
                                    </table>
                                    <p style="margin:24px 0 0; color:#737373; font-size:13px; line-height:20px;">Este código expira em <strong style="color:#404040;">15 minutos</strong>.</p>
                                    <p style="margin:28px 0 0; padding-top:20px; border-top:1px solid #e5e5e5; color:#a3a3a3; font-size:12px; line-height:18px;">Se você não criou uma conta, pode ignorar este email com segurança.</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:20px 0 0; color:#a3a3a3; font-size:12px;">Mensagem automática. Não responda este email.</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
