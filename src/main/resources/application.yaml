spring:
  application:
    name: authentication-api

  profiles:
    default: dev

  jackson:
    time-zone: UTC

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      ddl-auto: none
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration

  web:
    resources:
      add-mappings: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  RabbitMQ:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USER}
    password: ${MQ_PASS}
    virtual-host: /

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  address: 0.0.0.0
  port: 8080

app:
  frontend-url: ${FRONTEND_URL}
  email-from: ${MAIL_FROM}

  scheduler:
    account-activation-delay: ${ACCOUNT_ACTIVATION_DELAY}
    forgot-password-delay: ${RECOVER_PASSWORD_DELAY}
    session-delay: ${SESSION_DELAY}

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}

  rate-limit:
    global:
      capacity: ${RATE_LIMIT_GLOBAL_CAPACITY}
      refill-tokens: ${RATE_LIMIT_GLOBAL_REFILL_TOKENS}
      duration: ${RATE_LIMIT_GLOBAL_DURATION}

  secrets:
    issuer: authentication-api
    access-token: ${ACCESS_TOKEN_SECRET}
    hmac: ${HMAC_SECRET}
