
name: CD - Deploy

on:
  workflow_run:
    workflows: ["CD - Publish Image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Install cloudflared
        run: |
          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host debian-deploy
              HostName deploy.guilhermesebastiao.dev
              User deploy
              IdentityFile ~/.ssh/id_ed25519_deploy
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              ProxyCommand cloudflared access ssh --hostname %h
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy API
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 \
            debian-deploy "bash -s -- '$IMAGE_TAG'" <<'REMOTE'
          set -euo pipefail

          TAG="$1"
          cd /srv/apps/authentication-api

          echo "Updating repository..."
          git pull --ff-only origin main

          echo "Validating image tag..."
          [[ "$TAG" =~ ^[a-f0-9]{40}$ ]]

          echo "Pulling image $TAG..."
          API_IMAGE_TAG="$TAG" \
            docker compose -f compose.prod.yaml pull api

          echo "Recreating API..."
          API_IMAGE_TAG="$TAG" \
            docker compose -f compose.prod.yaml \
            up -d --no-deps --no-build api

          echo "Checking container status..."
          CONTAINER_ID=$(docker compose -f compose.prod.yaml ps -q api)
          test -n "$CONTAINER_ID"
          test "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID")" = "true"

          echo "Saving deployed image tag..."
          umask 077
          printf 'API_IMAGE_TAG=%s\n' "$TAG" > .deploy.env

          echo "Deployment completed: $TAG"
          REMOTE