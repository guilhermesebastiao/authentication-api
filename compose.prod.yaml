name: authentication-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: authentication-api:latest
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?required}
      MQ_HOST: rabbitmq
      MQ_PORT: 5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: UTC
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1280m
    networks:
      - authentication-network

  postgres:
    image: 'postgres:18.4'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?required}
      POSTGRES_PASSWORD: ${DB_PASS:?required}
      POSTGRES_DB: ${DB_NAME:?required}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 1024m
    networks:
      - authentication-network

  rabbitmq:
    image: 'rabbitmq:4.3.4-management'
    restart: unless-stopped
    environment:
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK_ABSOLUTE: 384MiB
      RABBITMQ_DEFAULT_USER: ${MQ_USER:?required}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASS:?required}
      TZ: UTC
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    networks:
      - authentication-network

  redis:
    image: 'redis:8.2.1-alpine'
    restart: unless-stopped
    environment:
      REDIS_PASS: ${REDIS_PASS:?required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 160mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASS\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASS\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - authentication-network

networks:
  authentication-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
